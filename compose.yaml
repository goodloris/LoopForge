name: loopforge
# One database service runs: LOOPFORGE_DATABASE in .env (postgres, the
# default, or mysql) names it, and the scripts pass it as a Compose profile
# next to `platform`. Plain `docker compose` commands that name the service
# (`docker compose exec -T postgres psql ...`) need no profile.
services:
  postgres:
    profiles: [postgres]
    # Debian (glibc) image, the same one CI runs the repository tests on.
    image: postgres:17
    environment:
      POSTGRES_DB: loopforge
      POSTGRES_USER: loopforge
      POSTGRES_PASSWORD: ${LOOPFORGE_DB_PASSWORD:?Run scripts/configure.sh first}
      # UTF8 with byte-order C.UTF-8 collation and ctype; see migrations/postgres/README.md.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "127.0.0.1:${LOOPFORGE_POSTGRES_PORT:-35432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP, so the socket-only server the image runs during initdb does not count.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U loopforge -d loopforge"]
      interval: 2s
      timeout: 3s
      retries: 60
  mysql:
    profiles: [mysql]
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: loopforge
      MYSQL_USER: loopforge
      MYSQL_PASSWORD: ${LOOPFORGE_DB_PASSWORD:?Run scripts/configure.sh first}
      MYSQL_ROOT_PASSWORD: ${LOOPFORGE_DB_ROOT_PASSWORD:?Run scripts/configure.sh first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:${LOOPFORGE_MYSQL_PORT:-33315}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u loopforge --silent"]
      interval: 2s
      timeout: 3s
      retries: 60
  platform:
    profiles: [platform]
    # Published release stack: never builds. Bump the pinned tag (here and in
    # AGENTFLOW_ISOLATED_IMAGE) with each release; source builds use compose.dev.yaml.
    image: ${LOOPFORGE_IMAGE:-ghcr.io/goodloris/loopforge:0.7.0}
    ports:
      - "${LOOPFORGE_BIND:-0.0.0.0}:${AGENTFLOW_HTTP_PORT:-8090}:8080"
    environment:
      AGENTFLOW_HTTP_PORT: 8080
      # The in-network DSN of the selected database, written by scripts/configure.sh.
      AGENTFLOW_DATABASE_DSN: ${LOOPFORGE_COMPOSE_DSN:?Run scripts/configure.sh first}
      # Legacy name for images before PostgreSQL support (upstream 0.4.0 and earlier),
      # which read only this one. Newer images prefer AGENTFLOW_DATABASE_DSN.
      AGENTFLOW_MYSQL_DSN: ${LOOPFORGE_COMPOSE_DSN}
      AGENTFLOW_SESSION_SECRET: ${AGENTFLOW_SESSION_SECRET:?Run scripts/configure.sh first}
      AGENTFLOW_AUTH_REQUIRED: "true"
      AGENTFLOW_ALLOW_SIGNUP: ${AGENTFLOW_ALLOW_SIGNUP:-true}
      AGENTFLOW_SECURE_COOKIES: ${AGENTFLOW_SECURE_COOKIES:-false}
      AGENTFLOW_GITHUB_CLIENT_ID: ${AGENTFLOW_GITHUB_CLIENT_ID:-}
      AGENTFLOW_GIT_SSH_KNOWN_HOSTS: ${AGENTFLOW_GIT_SSH_KNOWN_HOSTS:-}
      AGENTFLOW_ASSISTANT_SESSION_DIR: /data/assistant
      AGENTFLOW_CONVERSATION_DIR: ${LOOPFORGE_DATA_DIR}/conversations
      AGENTFLOW_CLARIFY_SESSION_DIR: /data/clarify
      AGENTFLOW_ASSISTANT_MODEL: ${AGENTFLOW_ASSISTANT_MODEL:-}
      AGENTFLOW_ASSISTANT_MODELS: ${AGENTFLOW_ASSISTANT_MODELS:-}
      AGENTFLOW_DEFAULT_EXECUTOR: ${AGENTFLOW_DEFAULT_EXECUTOR:-}
      AGENTFLOW_PREVIEW_PUBLIC_URL: ${AGENTFLOW_PREVIEW_PUBLIC_URL:-}
      AGENTFLOW_PLATFORM_MCP_URL: ${AGENTFLOW_PLATFORM_MCP_URL:-http://platform:8080}
      AGENTFLOW_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-loopforge}_default
      AGENTFLOW_LOCAL_SANDBOX: docker
      AGENTFLOW_ISOLATED_IMAGE: ${LOOPFORGE_IMAGE:-ghcr.io/goodloris/loopforge:0.7.0}
      HOME: ${LOOPFORGE_DATA_DIR:?Run scripts/configure.sh first}/home
      AGENTFLOW_RUNNER_BINARY: /app/bin/agentflow-runner-{os}-{arch}
      AGENTFLOW_GATE_MCP_BINARY: /app/bin/agentflow-gate-mcp-{os}-{arch}
      # Claude Code is not bundled; it is installed from npm here on first use.
      AGENTFLOW_RUNTIME_CLI_DIR: ${LOOPFORGE_DATA_DIR}/cli
      # Kiro CLI runs on the host's subscription login (`kiro-cli login`);
      # each run copies only the login out of this read-only mount.
      AGENTFLOW_KIRO_DATA_DIR: /kiro-host
    command: ["-workspaces", "${LOOPFORGE_DATA_DIR}/workspaces"]
    volumes:
      - platform-data:/data
      # Docker sandboxes bind workspace paths on the host, so the data
      # directory keeps the same absolute path inside the container.
      - ${LOOPFORGE_DATA_DIR}:${LOOPFORGE_DATA_DIR}
      - ${LOOPFORGE_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # The host's kiro-cli data directory as an absolute path, not ~, e.g.
      # LOOPFORGE_KIRO_DATA_DIR=/home/<you>/.local/share/kiro-cli on Linux or
      # LOOPFORGE_KIRO_DATA_DIR="/Users/<you>/Library/Application Support/kiro-cli"
      # on macOS. Unset leaves Kiro CLI unconfigured.
      - ${LOOPFORGE_KIRO_DATA_DIR:-${LOOPFORGE_DATA_DIR}/kiro-host}:/kiro-host:ro
    # Only the database whose profile is active is waited for.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped
volumes:
  postgres-data:
  mysql-data:
  platform-data:
