    <linearGradient id="bgl-tip" x1="34" y1="4" x2="48" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFC774"/><stop offset="1" stop-color="#D9782A"/></linearGradient>
