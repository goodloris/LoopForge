# Source build of this checkout, layered on compose.yaml:
#   ./start.sh dev     or   docker compose -f compose.yaml -f compose.dev.yaml --profile platform --profile postgres up --build
# (--profile mysql for a MySQL installation; LOOPFORGE_DATABASE in .env says which).
# The fixed local tag keeps source builds from overwriting the pinned GHCR image.
services:
  platform:
    image: loopforge-platform:local
    build:
      context: .
      args:
        LOOPFORGE_BUILD_JOBS: ${LOOPFORGE_BUILD_JOBS:-}
        LOOPFORGE_COMMIT: ${LOOPFORGE_COMMIT:-}
        # Go module proxy and npm registry for the source build. Defaults keep
        # the public proxy/registry; set GOPROXY / NPM_CONFIG_REGISTRY in .env
        # (e.g. GOPROXY=https://goproxy.cn,direct) where they are unreachable.
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    environment:
      AGENTFLOW_ISOLATED_IMAGE: loopforge-platform:local
